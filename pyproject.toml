[project]
name = "nido-analytics"
version = "1.0.0"
description = "E-commerce analytics for Nido Home: SQL models, Python pipeline and Streamlit dashboard"
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
