name: 📊 Data request
description: Ask the analytics team for a new analysis, metric or dashboard change
title: "[Data request]: "
labels: ["data-request"]
body:
  - type: input
    id: requester
    attributes:
      label: Requested by
      placeholder: "e.g. Aylin (Marketing)"
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: Business question
      description: What decision will this analysis support?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How will we know the request is done?
      value: |
        - [ ] 
        - [ ] 
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options: ["P1 - this sprint", "P2 - next sprint", "P3 - nice to have"]
    validations:
      required: true
  - type: input
    id: deadline
    attributes:
      label: Deadline
      placeholder: "YYYY-MM-DD"
